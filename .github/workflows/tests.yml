name: Run Tests

on:
    workflow_dispatch:
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Headless Validation
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v4

            -   name: Download & Install Godot
                run: |
                    GODOT_VERSION="4.3-stable"
                    wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
                    unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
                    sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
                    sudo chmod +x /usr/local/bin/godot
                    godot --version

            -   name: Import Assets & Refresh Cache
                run: |
                    log=$(mktemp)
                    godot --headless --path . --import 2>&1 | tee "$log"
                    ! grep -E '^(SCRIPT ERROR:|ERROR:)' "$log"

            -   name: Validate Scenes (Smoke Tests)
                run: |
                    scenes=(
                      "menu/menu"
                      "games/snake/snake"
                      "games/space_invaders/invaders"
                      "games/forest/forest"
                      "games/neon_breach/breach"
                    )
                    for scene in "${scenes[@]}"; do
                      echo ">>> Validating res://${scene}.tscn..."
                      log=$(mktemp)
                      godot --headless --path . "res://${scene}.tscn" --quit-after 60 2>&1 | tee "$log"
                      if grep -E '^(SCRIPT ERROR:|ERROR:|WARNING: .*leaked)' "$log"; then
                        exit 1
                      fi
                    done
                    echo ">>> All scenes validated successfully with zero errors!"

            -   name: Gameplay Regression Tests
                run: |
                    log=$(mktemp)
                    XDG_DATA_HOME="$(mktemp -d)" godot --headless --path . --script res://tests/gameplay_test.gd 2>&1 | tee "$log"
                    ! grep -E '^(SCRIPT ERROR:|ERROR:|WARNING: .*leaked)' "$log"
